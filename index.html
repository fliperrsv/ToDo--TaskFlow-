<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TaskFlow 3.0 – умный менеджер задач</title>
    <meta name="description" content="Современный ToDo-менеджер с категориями, приоритетами, дедлайнами, поиском и тёмной темой.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1><i class="fas fa-tasks"></i> TaskFlow 3.0</h1>
        <div class="header-actions">
            <button class="icon-btn" id="exportBtn"><i class="fas fa-download"></i> Экспорт</button>
            <button class="icon-btn" id="importBtn"><i class="fas fa-upload"></i> Импорт</button>
            <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
        </div>
    </div>

    <div class="task-form">
        <div class="form-row">
            <input type="text" id="taskTitle" placeholder="Что нужно сделать?">
            <select id="taskCategory">
                <option value="Работа">💼 Работа</option>
                <option value="Личное">🏠 Личное</option>
                <option value="Учёба">📚 Учёба</option>
                <option value="Другое">🎯 Другое</option>
            </select>
        </div>
        <div class="form-row">
            <select id="taskPriority">
                <option value="high">🔥 Высокий приоритет</option>
                <option value="medium">⚡ Средний приоритет</option>
                <option value="low">🌿 Низкий приоритет</option>
            </select>
            <input type="date" id="taskDeadline">
            <button id="addTaskBtn" class="btn-primary"><i class="fas fa-plus"></i> Добавить задачу</button>
        </div>
    </div>

    <div class="search-filter">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Поиск задач...">
        </div>
        <div class="filter-group" id="filterContainer">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Выполненные</button>
        </div>
    </div>

    <div class="stats" id="stats"></div>
    <ul id="taskList" class="task-list"></ul>
    <button id="clearCompletedBtn" class="icon-btn" style="background:#e53e3e; color:white; border:none;">Очистить выполненные</button>
</div>

<script src="script.js"></script>
</body>
</html>
