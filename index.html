<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | ToDo-менеджер</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1><i class="fas fa-check-circle"></i> TaskFlow</h1>
            <p>Умный планировщик задач</p>
        </header>
        <div class="task-input">
            <input type="text" id="taskInput" placeholder="Новая задача...">
            <button id="addTaskBtn"><i class="fas fa-plus"></i> Добавить</button>
        </div>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Выполненные</button>
        </div>
        <ul id="taskList" class="task-list"></ul>
        <div class="stats">
            <span id="taskCount">0 задач</span>
            <button id="clearCompletedBtn" class="clear-btn">Очистить выполненные</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
